<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9e7044">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #9e7044; color: #3a2414; overflow: hidden; touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #9e7044 repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 3px, rgba(255,255,255,.03) 3px 6px); visibility: hidden; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
#card { position: relative; width: min(78vw, 420px); padding: 26px 22px 22px; background: #d9b887; border: 3px solid #3a2414;
  border-radius: 6px 12px 5px 10px; box-shadow: 6px 8px 0 rgba(40,22,10,.45); text-align: center; transform: rotate(-1.2deg); }
#card:before { content: ""; position: absolute; top: -14px; left: 50%; width: 92px; height: 26px; margin-left: -46px; background: rgba(235,222,170,.82);
  border: 1px solid rgba(80,60,30,.35); transform: rotate(2deg); }
#title { font-size: 40px; font-weight: 800; letter-spacing: 1px; margin: 4px 0 2px; }
#tag { font-size: 14px; opacity: .8; margin: 0 0 18px; }
#bar { height: 22px; border: 3px solid #3a2414; border-radius: 4px 7px 4px 6px; background: #efe0bd; overflow: hidden; }
#fill { height: 100%; width: 0%; background: repeating-linear-gradient(135deg, #c8893a 0 10px, #b87a2c 10px 20px); transition: width .15s linear; }
#msg { font-size: 13px; margin-top: 10px; min-height: 18px; opacity: .85; }
#tip { font-size: 13px; margin-top: 14px; padding-top: 10px; border-top: 2px dashed rgba(58,36,20,.4); opacity: .8; }
#status-notice { display: none; margin-top: 14px; padding: 12px; background: #f1d9c8; border: 2px solid #8a2c1c; color: #5a1a10; border-radius: 6px; font-size: 14px; white-space: pre-line; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="$GODOT_URL.icon.png">
<link rel="apple-touch-icon" href="$GODOT_URL.apple-touch-icon.png">
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Pennyfold needs JavaScript.</noscript>

<div id="status">
  <div id="card">
    <div id="title">Pennyfold</div>
    <p id="tag">Don't fold under pressure.</p>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Unfolding the town...</div>
    <div id="tip"></div>
    <div id="status-notice"></div>
  </div>
</div>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

/* ---- Wallet bridge: a tiny NEAR login with no library. The game (GDScript) reads window.pennyfold.
   Login is the standard wallet redirect; the wallet sends the browser back with ?account_id=... */
window.pennyfold = (function () {
  const KEY = 'pennyfold.account';
  let account = '';
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('account_id')) {
      account = q.get('account_id');
      localStorage.setItem(KEY, account);
      history.replaceState(null, '', location.pathname);
    } else {
      account = localStorage.getItem(KEY) || '';
    }
  } catch (e) { /* storage blocked: guest only */ }
  // Shared-world server (Koyeb). Paste its wss:// address here after deploying, or open the page with ?world=wss://...
  const WORLD_URL = 'wss://pennyfold.onrender.com';
  let world = WORLD_URL;
  try { world = new URLSearchParams(location.search).get('world') || WORLD_URL; } catch (e) {}
  return {
    account: account,
    world: world,
    login: function () {
      const back = location.origin + location.pathname;
      location.href = 'https://testnet.mynearwallet.com/login/?success_url=' + encodeURIComponent(back) + '&failure_url=' + encodeURIComponent(back);
    },
    logout: function () { try { localStorage.removeItem(KEY); } catch (e) {} this.account = ''; },
  };
})();

const TIPS = [
  'Every coin you spend lands in the shop till, and the shop pays real wages.',
  'Running tires you out. Dodge through an attack for a Perfect Dodge.',
  'Red glowing beasts in the Ruins and the Mine are far deadlier than anything near town.',
  'Press Settle day in the ledger to send the day as NEAR transfers.',
  'Townsfolk eat, work, sleep and trade. Follow one around.',
];

(function () {
  const overlay = document.getElementById('status');
  const fill = document.getElementById('fill');
  const msg = document.getElementById('msg');
  const notice = document.getElementById('status-notice');
  const tip = document.getElementById('tip');
  tip.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
  let initializing = true;

  function show() { overlay.style.visibility = 'visible'; }
  function fail(err) {
    console.error(err);
    notice.style.display = 'block';
    notice.textContent = (err && err.message) ? err.message : (typeof err === 'string' ? err : 'Something went wrong while loading.');
    msg.textContent = '';
    initializing = false;
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    show();
    fail('Your browser is missing features Pennyfold needs:\n' + missing.join('\n') + '\n\nTry a recent Chrome, Firefox, Safari or Edge.');
    return;
  }
  show();
  engine.startGame({
    onProgress: function (cur, total) {
      if (!initializing) return;
      if (total > 0) {
        fill.style.width = Math.min(100, Math.round(cur / total * 100)) + '%';
        msg.textContent = 'Unfolding the town... ' + (cur / 1048576).toFixed(1) + ' of ' + (total / 1048576).toFixed(1) + ' MB';
      } else {
        fill.style.width = '40%';
        msg.textContent = 'Unfolding the town... ' + (cur / 1048576).toFixed(1) + ' MB';
      }
    },
  }).then(function () {
    initializing = false;
    msg.textContent = 'Cutting out the sprites...';
    /* keep the card until the game draws its own title (first frames bake sprites) */
    setTimeout(function () { overlay.remove(); }, 1200);
  }, fail);
})();
</script>
</body>
</html>
